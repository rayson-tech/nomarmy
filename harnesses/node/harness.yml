name: node
summary: Node dependencies and workspaces installed with npm, pnpm, yarn or bun
detect:
  - lockfile: package-lock.json
  - lockfile: npm-shrinkwrap.json
  - lockfile: pnpm-lock.yaml
  - lockfile: yarn.lock
  - lockfile: bun.lock
  - lockfile: bun.lockb
after: []
image:
  builtin: node
verification:
  quick: npm test
artifacts: []
requires: {}
network: none
docs: README.md
