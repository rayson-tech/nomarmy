    text: Credentials reach only the install RUN via mounts and never enter the build context
    proven_by:
      - file: tests/registry-secrets.test.mjs
        test: "registry mount is confined to the ${manager}"
      - file: tests/registry-secrets.test.mjs
        test: "registry credential cannot enter the build context via a manifest, symlink or hardlink"
        platforms: [posix]
    status: met
    security: true

  - id: REG-2
