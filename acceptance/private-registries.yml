    proven_by:
      - file: tests/registry-secrets.test.mjs
        test: "registry declarations are local-only, validated and excluded from the loaded job contract"
    status: met
    security: true

  - id: REG-3
    text: The image tag hashes declarations and rotation without exposing secret bytes
    proven_by:
      - file: tests/registry-secrets.test.mjs
        test: "registry tag hashes declarations and rotation without exposing secret bytes"
    status: met
    security: true
