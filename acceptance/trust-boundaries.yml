# Acceptance contract for the deterministic trust floor and its human gate.
feature: Trust boundaries, phases 1, 2 and 3
criteria:
  - id: TRUST-1
    text: trust.sensitive and trust.codeowners validate in .nomarmy.yml; bad entries name the rule
    proven_by:
      - file: tests/trust.test.mjs
        test: trust schema accepts the floor and rejects malformed rules with index and reason
    status: met
    security: true
  - id: TRUST-2
    text: A diff touching a sensitive path is human-gated with the rule's reason and the file
    proven_by:
      - file: tests/trust.test.mjs
        test: trust path globs span directories only with ** and normalize changed backslash paths
      - file: tests/trust.test.mjs
        test: trust paths and CODEOWNERS casefold both paths and patterns
      - file: tests/trust.test.mjs
        test: trust paths and CODEOWNERS normalize repeated separators and dot prefixes
      - file: tests/trust.test.mjs
        test: trust path braces are literal like CODEOWNERS braces
      - file: tests/trust.test.mjs
        test: trust and CODEOWNERS stars match newline filenames
      - file: tests/trust.test.mjs
        test: raw snapshots gate untracked renamed and deleted content and old paths
    status: met
    security: true
  - id: TRUST-3
    text: Content rules scan raw and committed bytes, changed lines and whole-file occurrence changes, normalizing invisible controls and Unicode spaces
    proven_by:
      - file: tests/trust.test.mjs
        test: content rules inspect added and removed lines, not context or file headers
      - file: tests/trust.test.mjs
        test: raw trust content survives attributes ${attributes}
      - file: tests/trust.test.mjs
        test: committed trust content gates UTF-16LE BOM conversion failures
      - file: tests/trust.test.mjs
        test: committed trust content unions raw and clean-filter views and gates failures
      - file: tests/trust.test.mjs
        test: trust process input preserves the safely captured bytes
      - file: tests/trust.test.mjs
        test: content occurrence normalization gates ${label}
      - file: tests/trust.test.mjs
        test: whole-file occurrence counts locate new matches after unchanged context
      - file: tests/trust.test.mjs
        test: raw trust content scans NUL and invalid UTF-8 bytes on both sides
      - file: tests/trust.test.mjs
        test: raw process output preserves invalid bytes and whitespace
      - file: tests/trust.test.mjs
        test: content literals collapse whitespace across added and removed lines as multisets
      - file: tests/trust.test.mjs
        test: raw snapshots gate untracked renamed and deleted content and old paths
      - file: tests/trust.test.mjs
        test: safe trust snapshots compare an outside symlink target string without reading sensitive target content
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate a symlink whose target string contains sensitive content
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots compare base symlink blobs like for like
        platforms: [posix]
    status: met
    security: true
  - id: TRUST-4
    text: "codeowners: true treats paths owned in CODEOWNERS as sensitive"
    proven_by:
      - file: tests/trust.test.mjs
        test: CODEOWNERS follows root anchoring, bare names, directories, wildcards and last-match ownership
      - file: tests/trust.test.mjs
        test: implement gates owner changes, new-file content, and sensitive diffs from failed workers
      - file: tests/trust.test.mjs
        test: trust paths and CODEOWNERS casefold both paths and patterns
      - file: tests/trust.test.mjs
        test: trust paths and CODEOWNERS normalize repeated separators and dot prefixes
      - file: tests/trust.test.mjs
        test: trust and CODEOWNERS stars match newline filenames
    status: met
    security: true
  - id: TRUST-5
    text: A gated job is review-required, its first issue says HUMAN REVIEW REQUIRED with the reasons, and the record carries trust
    proven_by:
      - file: tests/trust.test.mjs
        test: implement jobs enforce checkout trust, retain normal records, and leave unconfigured repos unchanged
      - file: tests/trust.test.mjs
        test: implement gates owner changes, new-file content, and sensitive diffs from failed workers
    status: met
    security: true
  - id: TRUST-6
    text: Rules come from the operator's checkout; a worker can't relax them, and changing the trust rules or CODEOWNERS is itself gated
    proven_by:
      - file: tests/trust.test.mjs
        test: changing the trust contract or any CODEOWNERS file is itself human-level
      - file: tests/trust.test.mjs
        test: implement jobs enforce checkout trust, retain normal records, and leave unconfigured repos unchanged
      - file: tests/trust.test.mjs
        test: missing and malformed trust snapshots fail closed
    status: met
    security: true
  - id: TRUST-7
    text: /feature stops before integrating a human-gated job and asks the operator; run_finish lists gated jobs
    proven_by:
      - file: tests/trust-surface.test.mjs
        test: trust feature playbook stops before integration and coordinator repeats the hard gate
      - file: tests/trust-surface.test.mjs
        test: trust run_finish lists only its human-gated jobs with exact reasons
      - file: tests/trust-surface.test.mjs
        test: trust report view places exact trust immediately after outcome when present
    status: met
    security: true
  - id: TRUST-8
    text: The PR block shows a Needs human review row with the reasons; stats counts gated jobs
    proven_by:
      - file: tests/trust-surface.test.mjs
        test: trust PR block shows gated count and short reasons only for scoped jobs
      - file: tests/trust-surface.test.mjs
        test: trust stats counts human-gated jobs in summary and details
    status: met
    security: true
  - id: TRUST-9
    text: A repo without trust rules gets no floor gating; the removed-check detector always runs, and the per-diff judgment runs unless trust.judgment is false
    proven_by:
      - file: tests/trust.test.mjs
        test: implement jobs enforce checkout trust, retain normal records, and leave unconfigured repos unchanged
      - file: tests/trust.test.mjs
        test: operator judgment opt-out records disabled judgments while defaults and worktree edits keep judgment enabled
      - file: tests/trust-phase2.test.mjs
        test: brief judgment opt-out uses operator checkout and records disabled without validator calls
      - file: tests/trust.test.mjs
        test: trust judgment schema accepts booleans and rejects other values
    status: met
    security: true
  - id: TRUST-10
    text: Worktree snapshots never follow symlinks or open special files; unchecked content, oversized files, symlinked parents and base gitlinks require human review
    proven_by:
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate an untracked symlink to /dev/zero promptly without reading it
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots compare an outside symlink target string without reading sensitive target content
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate a FIFO made with mkfifo without opening it
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate files under symlinked parent directories
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate oversized files before opening and accept the size boundary
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate directories and sockets without opening them
        platforms: [posix]
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate base gitlinks without cat-file blob even when deleted
    status: met
    note: the symlink, FIFO and socket proofs apply on POSIX only (the engine runs in WSL on Windows). A sandbox that denies mkfifo skips the FIFO test, so this criterion reads broken there; check it on the host or in CI
    security: true
  - id: TRUST-11
    text: Raw before and after snapshots deterministically flag removed or changed access guards, middleware, validations outside test files, tenant filters and row-level security with locations; other security findings in tests still count
    proven_by:
      - file: tests/trust-phase2.test.mjs
        test: removed checks detect raw guards middleware validations tenant filters and RLS with harmless near misses
      - file: tests/trust-phase2.test.mjs
        test: review regression collects else and elif denial branches with the retained auth guard
      - file: tests/trust-phase2.test.mjs
        test: review regression ignores quoted SQL semicolons when joining tenant statements
      - file: tests/trust-phase2.test.mjs
        test: review regression detects framework denials and auth-related next errors
      - file: tests/trust-phase2.test.mjs
        test: review regression recognizes patterned auth middleware and decorators
      - file: tests/trust-phase2.test.mjs
        test: review regression detects expanded tenant columns and additive custom identifiers
      - file: tests/trust.test.mjs
        test: review regression tenant column schema accepts identifiers and rejects malformed configuration
      - file: tests/trust.test.mjs
        test: review regression tenant columns come only from the operator checkout and remain additive
      - file: tests/trust-phase2.test.mjs
        test: test validation removals stay normal while helper security findings still escalate
      - file: tests/trust-review.test.mjs
        test: review two collects the unbraced JS else statement
      - file: tests/trust-review.test.mjs
        test: review two joins SQL dollar strings and hash comments
      - file: tests/trust-review.test.mjs
        test: review two recognizes array middleware and dotted decorators
      - file: tests/trust-review.test.mjs
        test: review two promotes imported test files including Python module paths
      - file: tests/trust-review.test.mjs
        test: review two scans and judges production referenced document extensions
      - file: tests/trust.test.mjs
        test: review two runtime classifies production dependencies from the untouched base
    status: met
    security: true
  - id: TRUST-12
    text: Compact unified snapshot hunks carry three context lines per change to diff-only Jev or judge; judged on production code only (docs and tests excluded); probabilities only escalate trust, comments are data and oversized evidence fails closed
    proven_by:
      - file: tests/trust-phase2.test.mjs
        test: diff judgment sees only raw diff data prefers Jev falls back to judge and cannot lower a planted-comment floor
      - file: tests/trust-phase2.test.mjs
        test: unavailable failing invalid and bounded validators retain deterministic escalation
      - file: tests/trust-phase2.test.mjs
        test: review regression oversized enabled diffs fail closed without lowering prior trust
      - file: tests/trust.test.mjs
        test: safe trust snapshots gate oversized files before opening and accept the size boundary
      - file: tests/trust-phase2.test.mjs
        test: snapshot hunks isolate sparse edits with exact context and unified ranges
      - file: tests/trust-production.test.mjs
        test: documentation-only judgment skips all documentation paths without changing the floor
      - file: tests/trust-production.test.mjs
        test: tests-only judgment skips the detector test-path rule
      - file: tests/trust-production.test.mjs
        test: mixed judgment sends only production hunks to Jev and judge
      - file: tests/trust-production.test.mjs
        test: excluded docs and tests retain sensitive path content CODEOWNERS and removed-check gates
      - file: tests/trust-measure.test.mjs
        test: corpus prints skipped production-free judgments without calling the validator
      - file: tests/trust-review.test.mjs
        test: review two classifies docs and spec production by evidence not directory
      - file: tests/trust-review.test.mjs
        test: review two promotes imported test files including Python module paths
      - file: tests/trust-review.test.mjs
        test: review two follows production imports transitively and preserves removed references
      - file: tests/trust-review.test.mjs
        test: review two scans and judges production referenced document extensions
      - file: tests/trust-review.test.mjs
        test: review two uses bounded safe repository snapshots for unchanged importers
      - file: tests/trust.test.mjs
        test: review two runtime classifies production dependencies from the untouched base
    status: met
    security: true
  - id: TRUST-13
    text: Normal, review and human levels retain assigned floors with plain reasons; review means high stakes and only human adds the hard stop
    proven_by:
      - file: tests/trust-phase2.test.mjs
        test: graded trust escalation table preserves assigned levels and exact plain reasons
      - file: tests/trust.test.mjs
        test: implement phase two grades raw removed checks and judgments as high stakes with a human-only hard stop
    status: met
    security: true
  - id: TRUST-14
    text: Bounded asynchronous brief judgment marks high stakes with admission notes and never refuses a job; no validator skips silently
    proven_by:
      - file: tests/trust-phase2.test.mjs
        test: brief admission marks high stakes with exact notes never refuses and skips silently without a validator
    status: met
    security: true
  - id: TRUST-15
    text: Corpus measurement continues after unavailable judgments, records why per item and reports the number judged alongside deterministic confusion counts
    proven_by:
      - file: tests/trust-measure.test.mjs
        test: synthetic corpus reports exact levels and confusion in text and JSON without writing
      - file: tests/trust-measure.test.mjs
        test: unavailable corpus judgments retain reasons continue and count judged items
    status: met
    security: true
  - id: TRUST-16
    text: The schema-validated operator-only map is human-gated when edited; a review-role scout brief and cited proposal import skip generated and vendored code, and accept/drop/edit review alone activates entries
    proven_by:
      - file: tests/trust-map.test.mjs
        test: trust map schema reads only the operator checkout and map edits are human gated
      - file: tests/trust-map.test.mjs
        test: trust map scout brief and cited import skip generated and vendored files
      - file: tests/trust-map.test.mjs
        test: trust review JSON accepts drops and edits proposals without implicit activation
      - file: tests/trust.test.mjs
        test: implement reach uses only the operator map and untouched base before worker edits
    status: met
    security: true
  - id: TRUST-17
    text: Base-snapshot symbol reach gates dependent changes at review and removed checks at human, with bounded depth and fan-out recorded and caches keyed by base commit and accepted map
    proven_by:
      - file: tests/trust-map.test.mjs
        test: trust reach gates two-call helpers not unrelated functions and removed checks become human
      - file: tests/trust-map.test.mjs
        test: trust reach states depth and fan-out caps and caches separately per base commit and map
      - file: tests/trust.test.mjs
        test: implement reach uses only the operator map and untouched base before worker edits
    status: met
    security: true
